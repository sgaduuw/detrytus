name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: Lint
        run: uv run ruff check detrytus tests
      - name: Format
        run: uv run ruff format --check detrytus tests
      - name: Types
        run: uv run mypy
      - name: Test
        run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
