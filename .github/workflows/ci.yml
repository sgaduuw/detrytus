name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check detrytus tests
      - name: Format
        run: uv run ruff format --check detrytus tests
      - name: Types
        run: uv run mypy
      - name: Test
        run: uv run pytest
