# Compressed bundles (docs/isa.md 6.1): what the machine does with them.
# Two c. instructions in a row share a bundle, slot A first; a lone one
# gets c.nop in slot B (docs/assembler.md). How the assembler pairs and
# encodes them is in asm/layout.toml and asm/errors.toml.

[defaults]
prelude = '''
        la    t0, handler
        csrw  mtvec, t0
'''
postlude = '''
        li    t6, -39366
        sw    a0, 0(t6)
'''

[[case]]
name = "slot A runs before slot B, then the next word"
program = '''
        c.li  a0, 5
        c.shi a0, 1
        addi  a0, a0, 1
handler:
'''
expect.exit_code = 16

[[case]]
name = "c.jal in slot A links slot B"
program = '''
        li    a0, 0
b0:     c.jal sub
        c.addi a0, 1
        la    s1, b0
        sub   a1, ra, s1
        j     done
sub:    addi  a0, a0, 10
        ret
done:
handler:
'''
expect.exit_code = 11
expect.registers = { a1 = 1 }

[[case]]
name = "c.jal in slot B links the next word"
program = '''
        li    a0, 0
b0:     c.nop
        c.jal sub
        addi  a0, a0, 1
        la    s1, b0
        sub   a1, ra, s1
        j     done
sub:    addi  a0, a0, 10
        c.jr  ra
done:
handler:
'''
expect.exit_code = 11
expect.registers = { a1 = 3 }

[[case]]
name = "a taken branch in slot A skips slot B"
program = '''
        li    a0, 0
        c.beqz zero, skip
        c.li  a0, 7
        li    a0, 9
skip:
handler:
'''
expect.exit_code = 0

[[case]]
name = "a branch in slot B counts from the bundle"
program = '''
        li    a0, 0
        c.nop
        c.beq zero, zero, there
        li    a0, 9
there:  j     done
handler:
        li    a0, -1                # counting from slot B lands in a word's slot B
done:
'''
expect.exit_code = 0

[[case]]
name = "a two-register branch reaches four words back"
program = '''
        li    a0, 0
        li    a1, 3
loop:   addi  a0, a0, 2
        nop
        nop
        nop
        c.addi a1, -1
        c.bne a1, zero, loop
handler:
'''
expect.exit_code = 6

[[case]]
name = "bgt is c.blt with the registers swapped"
program = '''
        li    a0, 0
        li    a1, 2
loop:   addi  a0, a0, 1
        c.addi a1, -1
        c.blt zero, a1, loop        # bgt a1, zero
handler:
'''
expect.exit_code = 2

[[case]]
name = "jalr enters slot B"
program = '''
        li    a0, 0
        la    t0, b0
        jalr  zero, 1(t0)
b0:     c.li  a0, 5
        c.addi a0, 1
handler:
'''
expect.exit_code = 1

[[case]]
name = "the page, stack and memory forms"
program = '''
        li    sp, 5 * 19683
        li    t1, 6 * 19683
        c.lip a0, 2 * 19683
        c.swsp a0, -3
        c.lwsp a1, -3
        c.sw  a1, (t1)
        lw    a2, 0(t1)
        lw    a3, -3(sp)
handler:
'''
expect.exit_code = 39366
expect.registers = { a1 = 39366, a2 = 39366, a3 = 39366 }

[[case]]
name = "the register forms"
program = '''
        li    a0, 7
        li    a1, 3
        li    a2, -2
        c.mv  a3, a0
        c.sub a3, a1                # 4
        c.mul a3, a2                # -8
        c.max a3, a2                # -2
        c.cmpi a3, -2               # 0
        c.mv  a4, a1
        c.cmp a4, a0                # -1
        c.mv  a5, a0
        c.min a5, a1                # 3
        c.add a5, a4                # 2
        c.mv  t2, a2
        c.tmax t2, a1               # tritwise max of -2 (-+) and 3 (+0): ++ = 4
        c.mv  t3, a2
        c.tmin t3, a1               # -0 = -3
        mv    a0, a3
handler:
'''
expect.exit_code = 0
expect.registers = { a4 = -1, a5 = 2, t2 = 4, t3 = -3 }

[[case]]
name = "instret counts each slot"
program = '''
        csrr  a1, instret
        c.nop
        c.nop
        csrr  a2, instret
        sub   a0, a2, a1
handler:
'''
expect.exit_code = 3

[[case]]
name = "sys sets tval to the next instruction"
program = '''
        li    a0, 0
b0:     sys
        la    s1, b0
        sub   a1, a1, s1
        sub   a2, a2, s1
        j     done
handler:
        csrr  a1, mtpc
        csrr  a2, mtval
        csrw  mtpc, a2
        tret
done:
'''
expect.exit_code = 0
expect.registers = { a1 = 0, a2 = 3 }

[[case]]
name = "c.sys in slot A resumes at slot B"
program = '''
        li    a0, 0
b0:     c.sys
        c.addi a0, 1
        la    s1, b0
        sub   a1, a1, s1
        sub   a2, a2, s1
        j     done
handler:
        csrr  a1, mtpc
        csrr  a2, mtval
        csrw  mtpc, a2
        c.tret
done:
'''
expect.exit_code = 1
expect.registers = { a1 = 0, a2 = 1 }

[[case]]
name = "c.sys in slot B resumes at the next word"
program = '''
        li    a0, 0
b0:     c.addi a0, 1
        c.sys
        la    s1, b0
        sub   a1, a1, s1
        sub   a2, a2, s1
        j     done
handler:
        csrr  a1, mtpc
        csrr  a2, mtval
        csrw  mtpc, a2
        tret
done:
'''
expect.exit_code = 1
expect.registers = { a1 = 1, a2 = 3 }

[[case]]
name = "tret resumes a trap in slot B"
# The load in slot B faults beyond RAM; the handler points t1 at RAM and
# returns to the slot, which runs again. Slot A runs once.
program = '''
        li    sp, 5 * 19683
        li    a1, 77
        sw    a1, 0(sp)
        li    a0, 0
        li    t1, 800 * 19683
b0:     c.addi a0, 1
        c.lw  a1, (t1)
        la    s1, b0
        sub   a2, a2, s1
        add   a0, a0, a1
        j     done
handler:
        csrr  a2, mtpc
        mv    t1, sp
        tret
done:
'''
expect.exit_code = 78
expect.registers = { a2 = 1 }

[[case]]
name = "an illegal slot traps with the bundle"
# Slot A is c.nop (op 4), slot B all zero: 121 + 243 * 4.
program = '''
b0:     .word 121 + 243 * 4
handler:
        csrr  a0, mtcause
        csrr  a1, mtpc
        csrr  a2, mtval
        la    s1, b0
        sub   a1, a1, s1
'''
expect.exit_code = 1
expect.registers = { a1 = 1, a2 = 1093 }

[[case]]
name = "an illegal expansion traps with the bundle"
# c.tret in ring 0 with sstatus.PR = +1 may not return there.
program = '''
        la    t0, ring0
        csrw  mtpc, t0
        tret                        # mtstatus.PR is 0 at reset: to ring 0
ring0:  li    t0, 1
        csrw  ststatus, t0          # PR = +1
b0:     c.tret
handler:
        csrr  a0, mtcause
        csrr  a2, mtval
        la    s1, b0
        lw    a3, 0(s1)
        sub   a2, a2, a3
'''
expect.exit_code = 1
expect.registers = { a2 = 0 }   # tval is the bundle

[[case]]
name = "slot B of a word that is not a bundle is illegal"
program = '''
        la    t0, w
        jalr  zero, 1(t0)
w:      .word 1234
handler:
        csrr  a0, mtcause
        csrr  a2, mtval
'''
expect.exit_code = 1
expect.registers = { a2 = 1234 }

[[case]]
name = "a pc ending in - is misaligned"
# tret is the one way to reach it: jalr refuses such a target itself.
program = '''
        la    t0, w
        addi  t0, t0, -1
        csrw  mtpc, t0
        tret
w:      nop
handler:
        csrr  a0, mtcause
        csrr  a2, mtval
        la    s1, w
        sub   a2, a2, s1
'''
expect.exit_code = 2
expect.registers = { a2 = -1 }
