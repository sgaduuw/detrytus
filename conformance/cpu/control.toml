# Branches, jumps and calls (docs/isa.md 7.8).

[defaults]
postlude = '''
        li    t6, -39366
        sw    a0, 0(t6)
'''

[[case]]
name = "br3 negative"
program = '''
        li    t0, -4
        br3   t0, neg, pos
        li    a0, 2
        j     out
neg:    li    a0, 1
        j     out
pos:    li    a0, 3
out:
'''
expect.exit_code = 1

[[case]]
name = "br3 zero"
program = '''
        li    t0, 0
        br3   t0, neg, pos
        li    a0, 2
        j     out
neg:    li    a0, 1
        j     out
pos:    li    a0, 3
out:
'''
expect.exit_code = 2

[[case]]
name = "br3 positive"
program = '''
        li    t0, 9
        br3   t0, neg, pos
        li    a0, 2
        j     out
neg:    li    a0, 1
        j     out
pos:    li    a0, 3
out:
'''
expect.exit_code = 3

[[case]]
name = "beq taken"
program = '''
        li a1, 1
        li a2, 1
        li a0, 0
        beq a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 1

[[case]]
name = "bne not taken"
program = '''
        li a1, 1
        li a2, 1
        li a0, 0
        bne a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 0

[[case]]
name = "blt taken"
program = '''
        li a1, -2
        li a2, 1
        li a0, 0
        blt a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 1

[[case]]
name = "bge taken on equal"
program = '''
        li a1, 1
        li a2, 1
        li a0, 0
        bge a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 1

[[case]]
name = "ble not taken"
program = '''
        li a1, 2
        li a2, 1
        li a0, 0
        ble a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 0

[[case]]
name = "bgt taken"
program = '''
        li a1, 2
        li a2, 1
        li a0, 0
        bgt a1, a2, yes
        j out
yes:    li a0, 1
out:
'''
expect.exit_code = 1

[[case]]
name = "call and return"
program = '''
        li    a0, 5
        call  double
        call  double
        j     out
double: add   a0, a0, a0
        ret
out:
'''
expect.exit_code = 20

[[case]]
name = "a branch reaches 300000 words each way"
# Beyond 12 trits of offset (±265720 words), so it needs all 13.
program = '''
        li    a0, 0
        beq   zero, zero, far
        j     out
back:   addi  a0, a0, 10
        j     out
        .org  900000
far:    addi  a0, a0, 1
        bne   a0, zero, back
out:
'''
expect.exit_code = 11

[[case]]
name = "br3 reaches 3000 words forward"
# Near the 8-trit limit of its offsets (±3280 words).
program = '''
        li    t0, 5
        br3   t0, neg, pos
        li    a0, 0
        j     out
        .org  -9000
neg:    li    a0, -1
        j     out
        .org  9000
pos:    li    a0, 1
out:
'''
expect.exit_code = 1

[[case]]
name = "br3 reaches 3000 words back"
program = '''
        li    t0, -5
        br3   t0, neg, pos
        li    a0, 0
        j     out
        .org  -9000
neg:    li    a0, -1
        j     out
        .org  9000
pos:    li    a0, 1
out:
'''
expect.exit_code = -1
