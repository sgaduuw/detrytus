[project]
name = "detrytus"
version = "0.1.0"
description = "Emulator and assembler for detrytus, a balanced-ternary CPU architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
detrytus = "detrytus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID", "C90", "N", "ARG"]
# N818 wants every exception named *Error. Several here are not errors:
# Trap, Halt and StepLimit are machine events that unwind the emulator,
# and their names follow the spec's vocabulary.
ignore = ["N818"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["detrytus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
