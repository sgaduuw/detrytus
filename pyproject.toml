[project]
name = "detrytus"
version = "0.1.0"
description = "Emulator and assembler for detrytus, a balanced-ternary CPU architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
detrytus = "detrytus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
