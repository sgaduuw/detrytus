# detrytus asm: listings, images and assembly errors.
# Recorded from the Rust command, after checking the Python one printed
# exactly the same (rust/cli/tests/golden.rs explains the format).

[[case]]
name = "listing of hello.s"
args = ["asm", "{root}/examples/hello.s"]
status = 0
stdout = '''
                     0  0000000000000000000+-+0++0+  auipc t0, 0                   la    t0, message
                     3  000000000000+0+-+-++-+0++-+  addi t0, t0, 29               la    t0, message
                     6  000000-000000000000+0-0++-+  addi t1, zero, -19683         li    t1, CONSOLE_OUT
                     9  0000000000000000+-++000000-  lt t2, 0(t0)                  lt    t2, 0(t0)          # one code point per tryte
                    12  00000000000++000+0000000--0  beq t2, zero, 24              beqz  t2, done
                    15  0000000000000000+0-+00000--  sw t2, 0(t1)                  sw    t2, 0(t1)
                    18  000000000000000++-++-+0++-+  addi t0, t0, 1                addi  t0, t0, 1
                    21  00000000000000000--00000-0-  jal zero, 9                   j     loop
                    24  00000-+000000000000+0-0++-+  addi t1, zero, -39366         li    t1, POWER_OFF
                    27  0000000000000000+0-000000--  sw zero, 0(t1)                sw    zero, 0(t1)
                    29                                                             .string "Hello from a balanced-ternary machine!\n"
'''
stderr = ""

