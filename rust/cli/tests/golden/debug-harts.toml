[[case]]
name = "a watchpoint on another hart"
args = ["debug", "--harts", "3", "{here}/programs/hart-store.s", "-x", "{tmp}/script.txt", "--batch"]
script = '''
watch 19683
c
p $pc
regs
c
'''
status = 0
stdout = '''
