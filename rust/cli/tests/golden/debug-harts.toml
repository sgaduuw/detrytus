[[case]]
name = "a plugged hart in the debugger"
args = ["debug", "--plug", "3:1", "{here}/programs/harts.s", "-x", "{tmp}/script.txt", "--batch"]
script = '''
s 3
hart
c
'''
status = 0
stdout = '''
=> 9  [hart 0, ring +1]  sw t0, -9(s0)
*    0  running  pc 9  ring +1
     1  stopped
ABstopped: powered off with exit code 0
'''
stderr = ""

