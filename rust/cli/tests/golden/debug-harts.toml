# detrytus debug with several harts: the hart in focus, hot-plug, and
# stopping points on harts other than 0.

[[case]]
name = "a session across three harts"
args = ["debug", "--harts", "3", "{root}/examples/harts.s", "-x", "{tmp}/script.txt", "--batch"]
script = '''
hart
hart -1
hart 5
b worker
c
hart
p $pc
c
hart 0
hart 1
trace on
s 2
trace off
s
hart
unplug 0
unplug 1 200
plug 4
plug
plug 4 5 6
info
restart
info
c
'''
status = 0
stdout = '''
