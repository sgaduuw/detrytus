[[case]]
name = "catching a trap on another hart"
args = ["debug", "--harts", "3", "{here}/programs/hart-store.s", "-x", "{tmp}/script.txt", "--batch"]
script = '''
catch breakpoint
c
hart
csr mtcause
c
'''
status = 0
stdout = '''
catching trap causes [5]
stopped: trap cause +5 at 39 <second+18>, tval 39 on hart 1
=> 42 <handler>  [hart 1, ring +1]  addi t6, zero, -39366
