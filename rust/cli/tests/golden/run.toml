usage: detrytus asm [-c] FILE [-o FILE] [--listing] [--mix]
       detrytus link [-o FILE] [--map] FILE...
       detrytus run [--ram-pages N] [--max-steps N] [--stats] [--trace] [--mix] [--input FILE]
                    [--live] [--no-jit] [--harts N] [--plug TIME:HART]... [--unplug TIME:HART]...
                    [--disk FILE [--disk-blocks N]] [--net loop|user|udp:LOCAL,PEER [--mac MAC]]
                    FILE...
       detrytus debug [--ram-pages N] [-b ADDR]... [-x FILE] [--batch] [--input FILE]
                    [--harts N] [--plug TIME:HART]... [--unplug TIME:HART]...
                    [--disk FILE [--disk-blocks N]] FILE...
       detrytus tc [-c] FILE [-o FILE]
       detrytus ll [--include FILE]... [--signed-pointers] [--prune [--root NAME]...] FILE...
                   [-o FILE]
detrytus: --input and --live both give the console its input
"""

[[case]]
name = "a frame sent on a loopback link comes back"
args = ["run", "--stats", "--net", "loop", "{root}/examples/net.s"]
status = 0
stdout = '''
Hello over the wire!
'''
stderr = '''

detrytus: 1115 steps, exit 0
'''

[[case]]
name = "with no --net a send fails"
args = ["run", "{root}/examples/net.s"]
status = 1
stdout = '''
no link: run with --net loop
'''
stderr = ""

[[case]]
name = "--mac needs --net"
args = ["run", "--mac", "02:00:00:00:00:02", "{root}/examples/net.s"]
status = 2
stdout = ""
stderr = '''
usage: detrytus asm [-c] FILE [-o FILE] [--listing] [--mix]
       detrytus link [-o FILE] [--map] FILE...
       detrytus run [--ram-pages N] [--max-steps N] [--stats] [--trace] [--mix] [--input FILE]
                    [--live] [--no-jit] [--harts N] [--plug TIME:HART]... [--unplug TIME:HART]...
                    [--disk FILE [--disk-blocks N]] [--net loop|user|udp:LOCAL,PEER [--mac MAC]]
                    FILE...
       detrytus debug [--ram-pages N] [-b ADDR]... [-x FILE] [--batch] [--input FILE]
                    [--harts N] [--plug TIME:HART]... [--unplug TIME:HART]...
                    [--disk FILE [--disk-blocks N]] FILE...
       detrytus tc [-c] FILE [-o FILE]
       detrytus ll [--include FILE]... [--signed-pointers] [--prune [--root NAME]...] FILE...
                   [-o FILE]
detrytus: --mac needs --net
'''

[[case]]
name = "--net takes loop, user or udp"
args = ["run", "--net", "tap0", "{root}/examples/net.s"]
status = 2
stdout = ""
stderr = '''
