[[case]]
name = "an unhandled trap"
args = ["run", "{here}/programs/crash.s"]
status = 70
stdout = ""
stderr = '''

detrytus: unhandled trap: cause +5 at pc 3 in ring +1, tval 3
'''

[[case]]
name = "the step limit"
args = ["run", "--max-steps", "50", "-"]
stdin = '''
spin: j spin
'''
status = 124
stdout = ""
stderr = '''

detrytus: no power-off after 50 steps
'''

[[case]]
name = "overlapping files"
args = ["run", "{root}/examples/hello.s", "{root}/examples/hello.s"]
status = 65
stdout = ""
stderr = '''
detrytus: images overlap at address -1
'''

[[case]]
name = "source on stdin"
args = ["run", "--stats", "-"]
stdin = '''
li a0, 7
li t6, -39366
sw a0, 0(t6)
'''
status = 7
stdout = ""
stderr = '''

detrytus: 3 steps, exit 7
'''

[[case]]
name = "an image"
args = ["run", "{tmp}/b.dti"]
setup = [["asm", "{root}/examples/bsearch.s", "-o", "{tmp}/b.dti"]]
status = 0
stdout = '''
5
0
8
-1
2
'''
stderr = ""

[[case]]
name = "a missing file"
args = ["run", "{tmp}/missing.s"]
status = 66
stdout = ""
stderr = '''
detrytus: {tmp}/missing.s: No such file or directory
'''
