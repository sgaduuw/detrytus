[package]
name = "detrytus-jit"
version = "0.1.0"
description = "A JIT compiler for the detrytus machine: hot runs of ternary code to host code, through Cranelift"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Cranelift's own minimum.
rust-version = "1.97"

[dependencies]
detrytus-core = { version = "0.1.0", path = "../core" }
cranelift-codegen = "0.138"
cranelift-frontend = "0.138"
cranelift-jit = "0.138"
cranelift-module = "0.138"
cranelift-native = "0.138"

[dev-dependencies]
detrytus-asm = { version = "0.1.0", path = "../asm" }
