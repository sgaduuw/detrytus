[package]
name = "detrytus-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for detrytus-core: scaffolding until the switchover"
publish = false

[lib]
name = "detrytus_rs"
crate-type = ["cdylib"]

[dependencies]
detrytus-core = { version = "0.1.0", path = "../core" }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
